<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>TextScope — Refine Your Words Before You Send</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <meta name="description" content="TextScope is a privacy-first AI writing assistant that instantly refines your messages with the perfect tone. Free. No signup." />

  <!-- Open Graph -->
  <meta property="og:title" content="TextScope — Rewrite Smarter" />
  <meta property="og:description" content="Paste your text, choose a tone, and get a refined version instantly. Free & private." />
  <meta property="og:type" content="website" />

   <style>
    body {
      margin: 0;
      font-family: Inter, system-ui, sans-serif;
      background: #0b0f1a;
      color: #fff;
    }
    .container {
      max-width: 900px;
      margin: 80px auto;
      padding: 24px;
    }
    h1 {
      font-size: 48px;
      margin-bottom: 8px;
    }
    p {
      color: #9aa4bf;
    }
    textarea {
      width: 100%;
      height: 160px;
      background: #11162a;
      border: 1px solid #1f2a44;
      color: #fff;
      padding: 16px;
      font-size: 16px;
      border-radius: 12px;
    }
    .tones {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin: 16px 0;
    }
    .tone {
      padding: 8px 14px;
      border-radius: 20px;
      border: 1px solid #2a3cff;
      cursor: pointer;
      color: #9aa4ff;
    }
    .tone.active {
      background: #2a3cff;
      color: #fff;
    }
    button {
      background: linear-gradient(90deg, #2a3cff, #00f2ff);
      border: none;
      padding: 14px 24px;
      font-size: 16px;
      border-radius: 12px;
      cursor: pointer;
      color: #000;
      margin-top: 16px;
    }
    .output {
      margin-top: 32px;
      background: #11162a;
      border-radius: 12px;
      padding: 20px;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>

<div class="container">
  <h1>TextScope</h1>
  <p>Refine your words before you send.</p>

  <textarea id="input" placeholder="Paste your text here..."></textarea>

  <div class="tones">
    <div class="tone active" data-tone="professional">Professional</div>
    <div class="tone" data-tone="friendly">Friendly</div>
    <div class="tone" data-tone="empathetic">Empathetic</div>
    <div class="tone" data-tone="confident">Confident</div>
    <div class="tone" data-tone="clear">Clear</div>
    <div class="tone" data-tone="shorter">Shorter</div>
  </div>

  <button onclick="refine()">Refine Text</button>

  <div id="output" class="output"></div>
</div>

<script>
const API_URL = "https://textscope.mehmetserifitak.workers.dev/";
let selectedTone = "professional";

document.querySelectorAll(".tone").forEach(t => {
  t.onclick = () => {
    document.querySelectorAll(".tone").forEach(x => x.classList.remove("active"));
    t.classList.add("active");
    selectedTone = t.dataset.tone;
  };
});

async function refine() {
  const input = document.getElementById("input").value;
  const output = document.getElementById("output");
  output.textContent = "Refining...";

  const res = await fetch(API_URL, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      text: input,
      tone: selectedTone
    })
  });

  const data = await res.json();
  output.textContent = data.output;
}
</script>

</body>
</html>
