  <style>
    body {
      font-family: system-ui, Arial, sans-serif;
      background: #0b0f1a;
      color: #fff;
      padding: 40px;
    }
    .box {
      max-width: 700px;
      margin: auto;
      background: #11162a;
      padding: 24px;
      border-radius: 12px;
      box-shadow: 0 0 30px rgba(0,255,255,0.1);
    }
    h1 {
      color: #00f0ff;
    }
    textarea, select, button {
      width: 100%;
      margin-top: 12px;
      padding: 12px;
      border-radius: 8px;
      border: none;
      font-size: 15px;
    }
    textarea {
      resize: vertical;
    }
    select {
      background: #1a2040;
      color: #fff;
    }
    button {
      background: linear-gradient(90deg, #00f0ff, #7c5cff);
      color: #000;
      font-weight: bold;
      cursor: pointer;
    }
    button:hover {
      opacity: 0.9;
    }
    #result {
      margin-top: 20px;
      white-space: pre-wrap;
      background: #0b1022;
      padding: 16px;
      border-radius: 8px;
      min-height: 60px;
    }
    .note {
      margin-top: 16px;

    }
  </style>

<body>

  <div class="box">
    <h1>TextScope</h1>
    <p>Rewrite your text instantly using AI. Free. No signup.</p>

    <textarea id="text" rows="6" placeholder="Paste your text here..."></textarea>

    <select id="tone">
      <option value="friendly">Friendly</option>
      <option value="formal">Formal</option>
      <option value="professional">Professional</option>
      <option value="casual">Casual</option>
    </select>

    <button onclick="submitText()">Rewrite Text</button>

    <div id="result"></div>

    <div class="note">
      Text is processed securely via our AI pipeline. No data is stored.
    </div>
  </div>

<script>
async function submitText() {
  const text = document.getElementById("text").value.trim();
  const tone = document.getElementById("tone").value;
  const resultBox = document.getElementById("result");

  if (!text) {
    resultBox.innerText = "Please enter some text.";
    return;
  }

  resultBox.innerText = "Processing...";

  try {
    const response = await fetch("https://textscope.mehmetserifitak.workers.dev/", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({ text, tone })
    });

    const data = await response.json();
    resultBox.innerText = data.output || "No output received.";
  } catch (error) {
    resultBox.innerText = "API connection error.";
  }
}
</script>
