<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>TextScope — Refine Your Words Before You Send</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <meta name="description" content="TextScope is a privacy-first AI writing assistant that instantly refines your messages with the perfect tone. Free. No signup." />

  <!-- Open Graph -->
  <meta property="og:title" content="TextScope — Rewrite Smarter" />
  <meta property="og:description" content="Paste your text, choose a tone, and get a refined version instantly. Free & private." />
  <meta property="og:type" content="website" />

  <style>
    body {
      margin: 0;
      font-family: Inter, system-ui, sans-serif;
      background: radial-gradient(circle at top, #0f172a, #020617);
      color: #e5e7eb;
    }

    .container {
      max-width: 820px;
      margin: 80px auto;
      padding: 40px;
      background: rgba(15, 23, 42, 0.85);
      border-radius: 20px;
      box-shadow: 0 0 40px rgba(56,189,248,0.15);
    }

    h1 {
      font-size: 42px;
      background: linear-gradient(90deg,#38bdf8,#a78bfa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 10px;
    }

    p {
      color: #94a3b8;
    }

    textarea {
      width: 100%;
      height: 160px;
      background: #020617;
      border: 1px solid #1e293b;
      border-radius: 12px;
      padding: 16px;
      color: #e5e7eb;
      font-size: 15px;
      resize: none;
    }

    select, button {
      margin-top: 16px;
      padding: 14px 18px;
      border-radius: 12px;
      border: none;
      font-size: 15px;
    }

    select {
      background: #020617;
      color: #e5e7eb;
      border: 1px solid #1e293b;
    }

    button {
      background: linear-gradient(90deg,#38bdf8,#a78bfa);
      color: #020617;
      cursor: pointer;
      font-weight: 600;
    }

    button:hover {
      opacity: 0.9;
    }

    .output {
      margin-top: 24px;
      padding: 20px;
      background: #020617;
      border-radius: 12px;
      border: 1px solid #1e293b;
      white-space: pre-wrap;
      min-height: 80px;
    }

    .badge {
      margin-top: 10px;
      font-size: 13px;
      color: #38bdf8;
    }
  </style>
</head>
<body>

<div class="container">
  <h1>TextScope</h1>
  <p>Refine your text with AI. Free 3 requests per day.</p>

  <textarea id="inputText" placeholder="Paste your text here..."></textarea>

<select id="tone">
  <option value="professional">Professional</option>
  <option value="friendly">Friendly</option>
  <option value="empathetic">Empathetic</option>
  <option value="confident">Confident</option>
  <option value="clear">Clear</option>
  <option value="shorter">Shorter</option>
</select>


  <br />
  <button onclick="refine()">Refine Text</button>

  <div class="badge">Free usage: 3 / day</div>

  <div id="output" class="output"></div>
</div>

<script>
async function refine() {
  const text = document.getElementById("inputText").value.trim();
  const tone = document.getElementById("tone").value;
  const output = document.getElementById("output");

  if (!text) {
    output.textContent = "Please enter some text.";
    return;
  }

  output.textContent = "Refining...";

  try {
    const res = await fetch("https://api.textscope.co/refine", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ text, tone })
    });

    const data = await res.json();
    output.textContent = data.output || "No response.";
  } catch (err) {
    console.error(err);
    output.textContent = "API connection error.";
  }
}
</script>

</body>
</html>
